version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./src/models/models:/app/src/models/models
    environment:
      - PYTHONPATH=/app


  mlflow:
    image: python:3.11-slim
    command:
      bash -c "pip install mlflow &&
              mlflow serer
              --host 0.0.0.0
              --port5000"

    ports:
      - "5000:5000"